name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        flutter: ['3.27.4', '3.47.0']
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ matrix.flutter }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed .
        if: matrix.flutter == '3.47.0'
      - run: flutter analyze
      - run: flutter test
      - run: python3 tool/check_docs.py
      - run: flutter test
        working-directory: example
      - run: flutter build web --release
        working-directory: example
      - run: dart pub publish --dry-run
        if: matrix.flutter == '3.47.0'
